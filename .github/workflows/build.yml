name: Build Release Binary
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - base-genesis
  pull_request:
    branches:
      - main
      - base-genesis

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build Binary
        run: |
          make build
          sha256sum build/mantrachaind > build/sha256sum.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: chain-binary
          path: build/

  validate-genesis:
    runs-on: ubuntu-latest
    needs: build  # waits for build job to complete successfully
    steps:
      - uses: actions/checkout@v4
      - name: Download compiled binary
        uses: actions/download-artifact@v4
        with:
          name: chain-binary
          path: build/
      - name: Make binary executable
        run: chmod +x build/mantrachaind
      - name: Install libwasmvm shared library
        # The binary is dynamically linked against libwasmvm (CosmWasm) but the
        # `build` job never installs it on the runner, so any attempt to execute
        # the downloaded binary fails with "libwasmvm.x86_64.so: cannot open
        # shared object file". Pull the exact version pinned in go.mod and drop
        # it on the linker path before we try to run the binary.
        run: |
          WASMVM_VERSION=$(grep 'github.com/CosmWasm/wasmvm/v2 ' go.mod | awk '{print $2}')
          curl -sSL -o /usr/lib/x86_64-linux-gnu/libwasmvm.x86_64.so \
            "https://github.com/CosmWasm/wasmvm/releases/download/${WASMVM_VERSION}/libwasmvm.x86_64.so"
          ldconfig
      - name: Validate genesis files
        run: |
          found=0
          for dir in networks/*/; do
            if [ -f "$dir/genesis.json" ]; then
              echo "Validating $dir/genesis.json..."
              ./build/mantrachaind genesis validate-genesis "$dir/genesis.json"
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No genesis.json files found yet — skipping validation."
          fi
